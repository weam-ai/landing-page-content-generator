services:

  # Node.js Backend API
  backend:
    build:
      context: ./Nodejs
      dockerfile: Dockerfile
    container_name: landing-page-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=${MONOGODB_URI}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - FIGMA_ACCESS_TOKEN=${FIGMA_ACCESS_TOKEN}
      - API_ROUTE_PREFIX=${API_ROUTE_PREFIX}
      - SERVICE_NAME=${SERVICE_NAME}
      - PORT=5000
      - NODE_ENV=production
    networks:
      - weam_app-network

  # Next.js Frontend
  frontend:
    build:
      context: ./Nextjs
      dockerfile: Dockerfile
      args: 
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
        - NEXT_PUBLIC_ENVIRONMENT=production
        - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH}
        - NEXT_PUBLIC_API_ROUTE_PREFIX=${NEXT_PUBLIC_API_ROUTE_PREFIX}
        - NEXT_PUBLIC_COOKIE_PASSWORD=${NEXT_PUBLIC_COOKIE_PASSWORD}
        - NEXT_PUBLIC_COOKIE_NAME=${NEXT_PUBLIC_COOKIE_NAME}
    container_name: landing-page-frontend
    restart: unless-stopped
    ports:
      - "4001:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_API_ROUTE_PREFIX=${NEXT_PUBLIC_API_ROUTE_PREFIX}
      - NEXT_PUBLIC_BASE_PATH=${NEXT_PUBLIC_BASE_PATH}
      - NEXT_PUBLIC_COOKIE_NAME=${NEXT_PUBLIC_COOKIE_NAME}
      - NEXT_PUBLIC_COOKIE_PASSWORD=${NEXT_PUBLIC_COOKIE_PASSWORD}
    networks:
      - weam_app-network
volumes:
  mongodb_data:

networks:
  weam_app-network:
    external: true